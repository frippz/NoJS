name: macOS nightly build

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos
  cancel-in-progress: true

jobs:
  build:
    name: Build NoJS for macOS
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build NoJS.app
        run: |
          xcodebuild \
            -project NoJS.xcodeproj \
            -scheme "NoJS (macOS)" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package NoJS.dmg
        id: package
        run: |
          staging="$RUNNER_TEMP/NoJS-dmg"
          short_sha="${GITHUB_SHA::8}"
          artifact="$RUNNER_TEMP/NoJS-macOS-nightly-${short_sha}.dmg"

          mkdir -p "$staging"
          ditto \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/NoJS.app" \
            "$staging/NoJS.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "NoJS" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 14

      - name: Compare with current nightly release
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.package.outputs.path }}
        run: |
          echo "publish=true" >> "$GITHUB_OUTPUT"

          latest_tag="$(gh release list \
            --limit 100 \
            --json tagName,isDraft \
            --jq '[.[] | select(.isDraft == false and (.tagName | startswith("nightly-")))] | .[0].tagName // empty')"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

          if [[ -z "$latest_tag" ]]; then
            echo "No existing nightly release found."
            exit 0
          fi

          comparison_dir="$RUNNER_TEMP/current-nightly"
          mkdir -p "$comparison_dir"

          if ! gh release download "$latest_tag" \
            --pattern "*.dmg" \
            --dir "$comparison_dir"; then
            echo "The current nightly has no DMG to compare."
            exit 0
          fi

          released_assets=("$comparison_dir"/*.dmg)
          current_md5="$(md5 -q "$ARTIFACT_PATH")"
          released_md5="$(md5 -q "${released_assets[0]}")"

          if [[ "$current_md5" == "$released_md5" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DMG matches $latest_tag; skipping the release."
          fi

      - name: Generate nightly release notes
        if: steps.release_check.outputs.publish == 'true'
        id: release_notes
        env:
          PREVIOUS_TAG: ${{ steps.release_check.outputs.latest_tag }}
        run: |
          notes="$RUNNER_TEMP/nightly-release-notes.md"
          range="$GITHUB_SHA"
          previous_tag="$PREVIOUS_TAG"

          if [[ "$previous_tag" == "nightly-$GITHUB_SHA" ]]; then
            previous_tag="$(git describe \
              --tags \
              --match "nightly-*" \
              --abbrev=0 \
              "$GITHUB_SHA^" 2>/dev/null || true)"
          fi

          if [[ -n "$previous_tag" ]] && git rev-parse --verify "$previous_tag^{commit}" >/dev/null 2>&1; then
            range="$previous_tag..$GITHUB_SHA"
          fi

          {
            echo "Unsigned macOS nightly DMG from commit \`$GITHUB_SHA\`."
            echo
            echo "Changes:"
            echo
            git log --reverse \
              --format="- [\`%h\`](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s" \
              "$range"
          } > "$notes"

          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish SHA-tagged nightly release
        if: steps.release_check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.package.outputs.path }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.path }}
        run: |
          tag="nightly-${GITHUB_SHA}"
          title="NoJS nightly ${GITHUB_SHA::7}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ARTIFACT_PATH" --clobber
            gh release edit "$tag" --notes-file "$RELEASE_NOTES_PATH"
          else
            gh release create "$tag" "$ARTIFACT_PATH" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$RELEASE_NOTES_PATH" \
              --prerelease
          fi
