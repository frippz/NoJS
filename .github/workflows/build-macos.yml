name: Build macOS app

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos
  cancel-in-progress: true

jobs:
  build:
    name: Build NoJS for macOS
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build NoJS.app
        run: |
          xcodebuild \
            -project NoJS.xcodeproj \
            -scheme "NoJS (macOS)" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package NoJS.dmg
        id: package
        run: |
          staging="$RUNNER_TEMP/NoJS-dmg"
          artifact="$RUNNER_TEMP/NoJS-macOS-nightly-${GITHUB_SHA}.dmg"

          mkdir -p "$staging"
          ditto \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/NoJS.app" \
            "$staging/NoJS.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "NoJS" \
            -srcfolder "$staging" \
            -format UDZO \
            -ov \
            "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          retention-days: 14

      - name: Publish SHA-tagged nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ steps.package.outputs.path }}
        run: |
          tag="nightly-${GITHUB_SHA}"
          title="NoJS nightly ${GITHUB_SHA::7}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ARTIFACT_PATH" --clobber
          else
            gh release create "$tag" "$ARTIFACT_PATH" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "Unsigned macOS nightly DMG from commit ${GITHUB_SHA}." \
              --prerelease
          fi
